[package]
name = "rag-pipeline-web"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# examples in docs don't run without a running database, etc.
doctest = false

[features]
test-helpers = ["dep:serde_json", "dep:tower", "dep:hyper", "dep:rag-pipeline-macros"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
rag-pipeline-config = { path = "../config" }

serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.34", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }

serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tower = { version = "0.5", features = ["util"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
markdown2pdf = "0.1.6"
markdownify = "0.2.1"
rag-pipeline-macros = { path = "../macros", optional = true }
kalosm = { git = "https://github.com/floneum/floneum", version = "0.4.0", features = ["full"] }

[dev-dependencies]
fake = "4.0"
googletest = "0.14"

rag-pipeline-web = { path = ".", features = ["test-helpers"] }
