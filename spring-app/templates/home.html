{% extends "index.html" %}

{% block main %}
<div class="chat-container">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h1 class="display-5 fw-bold">AI Charlie Sheen Assistant</h1>
            <p class="lead">Ask me anything and I'll do my best to help you!</p>
        </div>
    </div>

    <div id="chat-messages" class="chat-messages mb-4">
        {% if show_messages %}
            <div class="message user-message">
                <div class="d-flex align-items-center mb-2">
                    <div class="fw-bold">You</div>
                </div>
                <div>{{ user_message }}</div>
            </div>

            <div class="message ai-message">
                <div class="d-flex align-items-center mb-2">
                    <div class="fw-bold">AI Assistant</div>
                </div>
                <div id="ai-response">{{ ai_response }}</div>
            </div>
        {% else %}
            <div class="text-center text-muted my-5">
                <p>No messages yet. Start a conversation!</p>
            </div>
        {% endif %}
    </div>

    <div class="chat-input-container">
        <form hx-post="/chat/htmx" 
              hx-target="#chat-messages" 
              hx-swap="innerHTML"
              hx-indicator="#loading">
            <div class="mb-3">
                <textarea 
                    name="prompt" 
                    class="form-control chat-input" 
                    rows="3" 
                    placeholder="Type your message here..."
                    required
                ></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <div id="loading" class="htmx-indicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary px-4">
                    Send
                </button>
            </div>
        </form>
    </div>
</div>


{% endblock %}
