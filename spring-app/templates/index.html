<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/application.css">
    <style>
        body {
            background-color: #f7f7f8;
            min-height: 100vh;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .message {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        .user-message {
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
        }
        .ai-message {
            background-color: #f0f1f2;
            border: 1px solid #e5e5e5;
        }
        .chat-input {
            border-radius: 10px;
            resize: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request.htmx-indicator {
            display: block;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <main>
        {% block main %}
        {% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/htmx.min.js"></script>
<script src="/static/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/TypewriterJS/2.21.0/core.min.js"></script>
<script>
    document.addEventListener('htmx:afterSwap', function(event) {
        // Initialize TypewriterJS on the AI response element
        if (document.getElementById('ai-response')) {
            const aiResponseElement = document.getElementById('ai-response');
            const aiResponseText = aiResponseElement.textContent;
            console.log(aiResponseText);
            // Clear the element first
            //aiResponseElement.textContent = '';

            // Initialize TypewriterJS
            const typewriter = new Typewriter(aiResponseElement, {
                strings: [aiResponseElement.textContent],
                autoStart: false,
                delay: 30,
                cursor: ''
            });

            typewriter
                .typeString(aiResponseText)
                .start();
        }
    });
</script>

</body>
</html>
