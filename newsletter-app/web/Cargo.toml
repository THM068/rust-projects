[package]
name = "newsletter-app-web"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# examples in docs don't run without a running database, etc.
doctest = false

[features]
test-helpers = ["dep:serde_json", "dep:tower", "dep:hyper", "dep:newsletter-app-macros"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
socketioxide = "0.17.2"
newsletter-app-config = { path = "../config" }
newsletter-app-blnk-client = { path = "../blnk-client" }
validator = { version = "0.20.0", features = ["derive"] }

serde = { version = "1.0", features = ["derive",] }
tokio = { version = "1.34", features = ["full"] }
tower-http = { version = "0.5", features = ["full","fs","cors"] }
tracing = "0.1"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
urlencoding = "2.1.3"

serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tower = { version = "0.5", features = ["util"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
hyper-util.version = "0.1"
askama = "0.14.0"

newsletter-app-macros = { path = "../macros", optional = true }

[dev-dependencies]
fake = "4.0"
googletest = "0.14"

newsletter-app-web = { path = ".", features = ["test-helpers"] }
